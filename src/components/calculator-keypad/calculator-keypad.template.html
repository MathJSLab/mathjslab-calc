<template id="calculator-keypad-template">
    <section id="calculator-keypad-root" class="keypad" aria-label="Scientific keypad">
        <div class="keypad-header">
            <strong id="calculator-keypad-title">Scientific</strong>
            <span id="calculator-keypad-brand">MathJSLab</span>
        </div>
        <div id="calculator-keypad-tabs" class="tabs" role="tablist" aria-label="Keypad panels"></div>
        <fieldset id="calculator-keypad-base-control" class="base-control">
            <legend id="calculator-keypad-base-label">Base</legend>
            <div id="calculator-keypad-base" class="base-options"></div>
        </fieldset>
        <div id="calculator-keypad-keys" class="keys"></div>
    </section>
</template>
