<template id="keyboard-panel-template">
    <section id="keyboard-panel-root" class="keyboard-panel" aria-label="Scientific keyboard panel">
        <div class="keyboard-panel-header">
            <strong id="keyboard-panel-title">Scientific</strong>
            <span id="keyboard-panel-brand">MathJSLab</span>
        </div>
        <div id="keyboard-panel-tabs" class="tabs" role="tablist" aria-label="Keyboard panels"></div>
        <fieldset id="keyboard-panel-base-control" class="base-control">
            <legend id="keyboard-panel-base-label">Base</legend>
            <div id="keyboard-panel-base" class="base-options"></div>
        </fieldset>
        <div id="keyboard-panel-keys" class="keys"></div>
    </section>
</template>
